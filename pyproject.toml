[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwtradearb"
version = "1.0.0"
description = "Kamadan gold WTS/WTB scanner with local SQLite and a PySide6 UI (no Guild Wars automation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GWTradeArb" }]
keywords = ["guild-wars", "kamadan", "trade", "scanner"]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
gwtradearb = "gwtradearb.cli:main"

[project.urls]
Homepage = "https://github.com/BaCoaxx/GWTradeArb"
Releases = "https://github.com/BaCoaxx/GWTradeArb/releases/latest"
Issues = "https://github.com/BaCoaxx/GWTradeArb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: live HTTP against public Kamadan APIs (skip with -m 'not network')",
    "gui: PySide6 offscreen smoke (skip with -m 'not gui')",
]
